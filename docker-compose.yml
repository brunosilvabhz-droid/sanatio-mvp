services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sanatio
      POSTGRES_USER: sanatio
      POSTGRES_PASSWORD: sanatio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanatio -d sanatio"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sanatio:sanatio@postgres:5432/sanatio
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://192.168.18.175:5173}
      SECRET_KEY: change-me-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 720
      USE_MOCK_SOULMV: "true"
      EXPOSE_PATIENT_NAMES_IN_API: "false"
      SOULMV_ORACLE_HOST: ""
      SOULMV_ORACLE_PORT: "1521"
      SOULMV_ORACLE_SERVICE: ""
      SOULMV_ORACLE_USER: ""
      SOULMV_ORACLE_PASSWORD: ""
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-sanatio@impactocg.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-SANATIO}
      SUPPORT_CONTACT_EMAIL: ${SUPPORT_CONTACT_EMAIL:-contato@impactocg.com}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_PATIENT_NAME_RESOLVER_URL: ""
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
